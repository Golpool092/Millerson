<script>(function(){
function fmt(v){return Math.round(v).toLocaleString('ru-RU');}function fmtD(v,d){return (+v).toLocaleString('ru-RU',{minimumFractionDigits:d||2,maximumFractionDigits:d||2});}
function calc(){
  var prod=+document.getElementById('fProd').value||0;
  var del=+document.getElementById('fDeliv').value||0;
  var rest=+document.getElementById('fRest').value||0;
  var work=+document.getElementById('fWork').value||0;
  var oth=+document.getElementById('fOther').value||0;
  var inc=+document.getElementById('fIncome').value||0;
  var total=prod+del+rest+work+oth;
  var pct=inc>0?total/inc*100:0;
  document.getElementById('foodRes').style.display='grid';
  document.getElementById('foodRes').innerHTML=
    '<div class="result-item"><div class="result-item__label">Итого в месяц</div><div class="result-item__value">'+fmt(total)+' ₽</div></div>'+
    '<div class="result-item"><div class="result-item__label">В год</div><div class="result-item__value">'+fmt(total*12)+' ₽</div></div>'+
    '<div class="result-item orange"><div class="result-item__label">% от дохода</div><div class="result-item__value">'+fmtD(pct,1)+'%</div></div>'+
    '<div class="result-item"><div class="result-item__label">В день</div><div class="result-item__value">'+fmt(total/30)+' ₽</div></div>'+
    '<div class="result-item"><div class="result-item__label">Рекомендуемый лимит (30%)</div><div class="result-item__value">'+fmt(inc*0.3)+' ₽</div></div>'+
    '<div class="result-item"><div class="result-item__label">Экономия возможна</div><div class="result-item__value">'+(total>inc*0.3?fmt(total-inc*0.3)+' ₽':'В норме')+'</div></div>';
}
document.querySelectorAll('#fProd,#fDeliv,#fRest,#fWork,#fOther,#fIncome').forEach(function(el){el.addEventListener('input',calc);});calc();
})();
</script>
