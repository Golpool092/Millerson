<script>
  renderRatingSummary('rv-summary');
  renderReviews('rv-list');
  initReviewFilters('rv-list');

  // Update filter buttons with counts
  document.querySelectorAll('[data-rv-filter]').forEach(btn => {
    const cat = btn.dataset.rvFilter;
    if (cat !== 'all') {
      const count = REVIEWS.filter(r => r.category === cat).length;
      btn.textContent = btn.textContent.split('(')[0].trim() + ` (${count})`;
    }
  });
